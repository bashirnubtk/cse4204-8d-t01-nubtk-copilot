<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUBTK Copilot | Secure Admin Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #002B49; /* Deakin Navy Blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .admin-card {
            border: none;
            border-radius: 0;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            border-top: 5px solid #007A87;
        }
        .btn-admin {
            background-color: #007A87;
            color: white;
            border-radius: 0;
            transition: all 0.3s ease;
        }
        .btn-admin:hover {
            background-color: #002B49;
            color: white;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container" style="max-width: 450px;">
        <div class="text-center mb-4">
            <h2 class="text-white fw-bold"><i class="bi bi-shield-lock-fill text-warning me-2"></i>NUBTK Portal</h2>
            <p class="text-light text-opacity-75 small">Centralised Administrative Authority Network</p>
        </div>

        <div class="card admin-card p-4">
            <h4 class="text-center mb-4 fw-bold text-dark">System Staff Sign-In</h4>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} rounded-0 py-2 small">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Admin Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light rounded-0"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control rounded-0" placeholder="e.g. admin_username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-muted">Secure Security Key (Password)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light rounded-0"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control rounded-0" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-admin w-100 py-2 font-md text-uppercase tracking-wider fw-bold">Authorize Login</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="{% url 'home' %}" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left me-1"></i> Back to Public Campus Home</a>
            </div>
        </div>
    </div>

</body>
</html>
